<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f0718">
  <meta name="description" content="Simulación interactiva de la Nebulosa del Corazón.">
  <title>Nebulosa del Corazón</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="universe" aria-label="Simulación interactiva de la Nebulosa del Corazón">
    <canvas id="sky" tabindex="0" aria-label="Espacio estrellado y Nebulosa del Corazón"></canvas>

    <!-- Pantalla inicial minimalista -->
    <section class="opening-screen" id="openingScreen" aria-label="Pantalla de inicio">
      <div class="opening-content">
        <p class="opening-text">
          Por si no lo sabías me gusta mucho el espacio y las estrellas y te dedico esta nebulosa
        </p>
        <button class="opening-button" id="enterUniverseBtn" type="button">
          Continuar
        </button>
      </div>
    </section>

    <!-- Cuadro de texto minimalista al tocar las estrellas brillantes -->
    <div class="star-anchor" id="starAnchor" aria-live="polite">
      <section class="star-note" id="starNote" role="region" aria-label="Mensaje de la estrella" aria-hidden="true">
        <div class="star-note-connector" aria-hidden="true"></div>
        <div class="star-note-card">
          <button class="star-note-close" id="closeNote" type="button" aria-label="Cerrar">×</button>
          <p class="star-note-message" id="starNoteMessage"></p>
        </div>
      </section>
    </div>

    <audio id="bgAudio" src="audio.mp3" loop preload="auto"></audio>
  </main>
  <script src="script.js"></script>
</body>
</html>
